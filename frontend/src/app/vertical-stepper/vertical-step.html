<div class="vstep" [attr.data-state]="state">
  <span class="vstep__marker">
    @if (state === 'success') {
      <span class="vstep__circle vstep__circle--done">
        <img src="assets/icons/task-check.svg" width="20" height="20" alt="" />
      </span>
    } @else {
      <span class="vstep__circle">{{ number }}</span>
    }
  </span>
  @if (label) {
    <span class="vstep__label">{{ label }}</span>
  }
</div>
