<div class="vstep" [attr.data-state]="state">
  <span class="vstep__marker">
    @if (state === 'success') {
      <svg viewBox="0 0 43 43" aria-hidden="true">
        <rect x="2" y="2" width="39" height="39" rx="19.5" fill="url(#vstep-success)"/>
        <rect x="2" y="2" width="39" height="39" rx="19.5" stroke="white" stroke-width="4"/>
        <path d="M25.2123 17.7126C25.3884 17.545 25.6227 17.4523 25.8659 17.4541C26.109 17.456 26.3419 17.5522 26.5154 17.7225C26.6889 17.8927 26.7895 18.1238 26.7959 18.3668C26.8024 18.6099 26.7141 18.8459 26.5498 19.0251L21.5623 25.2626C21.4766 25.355 21.3731 25.4291 21.258 25.4806C21.1429 25.532 21.0187 25.5597 20.8926 25.5621C20.7666 25.5644 20.6414 25.5413 20.5245 25.4941C20.4076 25.447 20.3015 25.3767 20.2123 25.2876L16.9048 21.9801C16.8127 21.8943 16.7388 21.7908 16.6876 21.6758C16.6364 21.5608 16.6088 21.4366 16.6066 21.3108C16.6044 21.1849 16.6275 21.0598 16.6747 20.9431C16.7218 20.8264 16.792 20.7203 16.881 20.6313C16.9701 20.5423 17.0761 20.4721 17.1928 20.425C17.3096 20.3778 17.4346 20.3546 17.5605 20.3569C17.6864 20.3591 17.8105 20.3866 17.9255 20.4379C18.0405 20.4891 18.144 20.563 18.2298 20.6551L20.8473 23.2714L25.1886 17.7401L25.2123 17.7126Z" fill="white"/>
        <defs>
          <linearGradient id="vstep-success" x1="21.5" y1="4" x2="21.5" y2="39" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00BB74"/>
            <stop offset="1" stop-color="#079850"/>
          </linearGradient>
        </defs>
      </svg>
    } @else {
      <span class="vstep__circle">{{ number }}</span>
    }
  </span>
  @if (label) {
    <span class="vstep__label">{{ label }}</span>
  }
</div>
