<section [class]="look === 'showcase' ? 'stage' : 'auth'">
  @if (look === 'showcase') {
    <div class="stage__hero">
      <img class="stage__photo" src="assets/auth/hero.png?v=6" alt="กรมการค้าต่างประเทศ เชื่อมไทย สู่การค้าโลก" />
    </div>
  } @else {
    <img class="auth__bg" src="assets/auth/bg.webp" alt="" />
    <div class="auth__brand">
      <img class="auth__logo" src="assets/auth/logo.webp" alt="กรมการค้าต่างประเทศ" />
    </div>
  }
  <div [class]="look === 'showcase' ? 'stage__side' : 'auth__panel'">
    <div [class]="look === 'showcase' ? 'stage__card' : 'auth__body'" [class.auth__body--center]="look !== 'showcase' && center">
      <ng-content />
      @if (look !== 'showcase' && copyright) {
        <p class="auth__copy">COPYRIGHT DEPARTMENT OF FOREIGN TRADE ALL RIGHTS RESERVED<br />นโยบายเว็บไซต์ | การคุ้มครองข้อมูลส่วนบุคคล | นโยบายรักษาความมั่นคงปลอดภัย | การปฏิเสธความรับผิด</p>
      }
    </div>
  </div>
</section>
