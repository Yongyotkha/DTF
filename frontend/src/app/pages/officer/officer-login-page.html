<app-auth-shell look="showcase">
  <h1>เข้าสู่ระบบ</h1>
  <p class="lead">ระบบบริการอิเล็กทรอนิกส์ กรมการค้าต่างประเทศ</p>
  <label class="role">
    <span>สิทธิ์เข้าใช้งาน</span>
    <span class="role__control">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 18.5c.7-3 2.8-4.5 6.5-4.5s5.8 1.5 6.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <select aria-label="สิทธิ์เข้าใช้งาน" (change)="pickRole($any($event.target).value)">
        @for (item of roles; track item.username) {
          <option [value]="item.username" [selected]="item.username === rolePick">{{ item.label.split(' · ').join(' - ') }}</option>
        }
      </select>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10L12 16L18 10" fill="none" stroke="currentColor" stroke-linecap="round" /></svg>
    </span>
  </label>
  <app-input-field class="block" label="ชื่อผู้ใช้งาน" placeholder="ระบุชื่อผู้ใช้งาน" mark="card" [required]="true" [editable]="true" [state]="nameState" [helper]="nameHelp" [value]="loginName" (valueChange)="loginName = $event" />
  <app-input-field class="block" label="รหัสผ่าน" placeholder="ระบุรหัสผ่าน" inputType="password" mark="lock" [reveal]="true" [required]="true" [editable]="true" [state]="passwordState" [helper]="passwordHelp" [value]="password" (valueChange)="password = $event" />
  <a class="forgot" routerLink="/forgot-password">ลืมรหัสผ่าน</a>
  <app-button class="wide" size="lg" label="เข้าสู่ระบบ" (click)="enter()">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 12H21" fill="none" stroke="currentColor" stroke-linecap="round" /><path d="M15 18L21 12L15 6" fill="none" stroke="currentColor" stroke-linecap="round" /></svg>
  </app-button>
  <p class="legal"><span>นโยบายความเป็นส่วนตัว</span><span class="legal__bar">|</span><span>เงื่อนไขการใช้งาน</span><span class="legal__bar">|</span><span>ติดต่อสอบถาม</span></p>
</app-auth-shell>
