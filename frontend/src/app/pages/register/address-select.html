<div class="address">
  <label [class.error]="provinceError">
    <span>จังหวัด <span>*</span></span>
    <span class="combo" (focusout)="leave($event, 'province')">
      <input
        [class.placeholder]="!provinceQuery()"
        [value]="provinceQuery()"
        [disabled]="locked('province')"
        placeholder="เลือก"
        role="combobox"
        aria-autocomplete="list"
        [attr.aria-expanded]="open() === 'province'"
        (pointerdown)="show('province')"
        (focus)="show('province')"
        (input)="type('province', $any($event.target).value)"
        (keydown)="key('province', $event)"
      />
      @if (open() === 'province') {
        <ul class="menu" role="listbox">
          @for (name of provinceNames(); track name; let index = $index) {
            <li>
              <button type="button" role="option" [class.current]="index === active()" (pointerdown)="$event.preventDefault()" (click)="pick('province', name)">{{ name }}</button>
            </li>
          } @empty {
            <li class="empty">ไม่พบข้อมูล</li>
          }
        </ul>
      }
    </span>
    @if (provinceError) { <span class="meta">{{ provinceMessage }}</span> }
  </label>

    <span>รหัสไปรษณีย์ <span>*</span></span>

  <p class="address__error">โหลดข้อมูลที่อยู่ไม่สำเร็จ</p>
}
