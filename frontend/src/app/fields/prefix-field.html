<label [class.error]="error">
  @if (!bare) {
    <span>{{ label }}@if (required) { <span> *</span> }</span>
  }
  <select [class.placeholder]="!value" (change)="choose($any($event.target).value)" (blur)="blurred.emit()">
    <option value="" [selected]="!value">เลือก</option>
    @for (name of options; track name) {
      <option [value]="name" [selected]="name === value">{{ name }}</option>
    }
  </select>
  @if (error) { <span class="meta">{{ message }}</span> }
</label>
